name: "Deploy Assets"
description: Uploads and deploys static assets to a Twilio Serverless Service
author: 'step-security'
inputs:
  SERVICE_NAME:
    required: true
    description: Identifier for the Twilio Serverless Service to deploy to; the service is created automatically if it does not already exist
  ENVIRONMENT_NAME:
    required: false
    description: |
      (Optional) Friendly name of the target Twilio Serverless Environment. When omitted, falls back to:
      - **ENVIRONMENT_SUFFIX** when that input is provided
      - `production` in all other cases
  ENVIRONMENT_SUFFIX:
    required: false
    description: |
      (Optional) Domain suffix appended to the Serverless Environment URL. When omitted, falls back to:
      - **ENVIRONMENT_NAME** when that input is provided
      - `null` in all other cases
  REPLACE_MARKERS_IN_EXT:
    required: false
    description: |
      (Optional) Comma-separated list of text-based file extensions in which placeholder tokens will be substituted before deployment.

      Supported tokens:

      - **{{DOMAIN}}**: Substituted with the environment base URL. E.g. `https://service-name-0000-suffix.twil.io`
  TWILIO_API_KEY:
    required: true
    description: SID of the Twilio API Key used for authentication
  TWILIO_API_SECRET:
    required: true
    description: Secret value associated with the Twilio API Key
  ASSETS_DIRECTORY:
    required: true
    description: Path to the local directory whose contents (including subdirectories) will be deployed as assets
  UI_EDITABLE:
    required: false
    description: (Optional) When set to `true`, the service will be marked as editable via the Twilio Console
  PRESERVE_EXISTING:
    required: false
    description: (Optional) When set to `true`, any assets, functions, or dependencies already deployed but not included in this run are retained rather than removed
  BUILD_POLL_TIMEOUT_SECONDS:
    required: false
    description: (Optional) Maximum number of seconds to wait for the Twilio build to finish. Defaults to `50`; maximum allowed is `300`.
  BUILD_POLL_INTERVAL_SECONDS:
    required: false
    description: (Optional) How many seconds to wait between consecutive build status checks. Defaults to `5`; maximum allowed is `60`.

runs:
  using: node24
  main: dist/index.js