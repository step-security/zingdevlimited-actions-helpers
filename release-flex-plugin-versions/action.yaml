name: "Release Flex Plugin Versions"
description: "Creates a Flex Plugin Release that activates a specified set of plugin versions"
author: 'step-security'
inputs:
  PLUGIN_VERSIONS:
    description: Newline-delimited `KEY=VALUE` pairs where each key is a plugin's unique name and each value is the version to include in the release
    required: true
  RELEASE_NAME:
    description: Label assigned to the new Flex Plugin Release
    required: true
  RELEASE_DESCRIPTION:
    description: (Optional) Additional detail about the purpose or contents of the release
    required: false
  TWILIO_API_KEY:
    required: true
    description: SID of the Twilio API Key used for authentication
  TWILIO_API_SECRET:
    required: true
    description: Secret value corresponding to TWILIO_API_KEY

runs:
  using: node24
  main: dist/index.js