name: Update Content Templates
description: Applies Twilio Content Template definitions from a JSON config file to the account
author: 'step-security'

inputs:
  CONFIG_PATH:
    required: true
    description: Filesystem path to the Content Templates JSON config file. **Make sure this file has been checked out before this step runs.**
  ALLOW_REPLACE:
    required: false
    description: |
      (Optional) Set to `true` to delete and recreate a template whose body or
      variables differ from the config file. Content Templates are immutable in
      Twilio, so replacing one issues a new SID. Defaults to `false`, which
      leaves differing templates untouched.
  TWILIO_API_KEY:
    required: true
    description: SID of the Twilio API Key used for authentication
  TWILIO_API_SECRET:
    required: true
    description: Secret associated with the Twilio API Key

outputs:
  RESOURCES:
    description: "JSON array describing all Content Template resources created or updated during this run"

runs:
  using: node24
  main: dist/index.js
