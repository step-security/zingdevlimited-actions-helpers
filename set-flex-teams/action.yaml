name: Set Teams
description: Synchronises the Flex team configuration from a JSON file to the Twilio account
author: 'step-security'

inputs:
  DELETE_UNUSED:
    required: false
    description: When set to `true`, any teams that exist on the account but are absent from the JSON config are removed. Defaults to `false`, which leaves unreferenced teams untouched.
  CONFIG_PATH:
    required: true
    description: Filesystem path to the teams configuration JSON file. **Make sure this file has been checked out before this step runs.**
  TWILIO_API_KEY:
    required: true
    description: SID of the Twilio API Key used for authentication
  TWILIO_API_SECRET:
    required: true
    description: Secret associated with the Twilio API Key
    
runs:
  using: node24
  main: dist/index.js
