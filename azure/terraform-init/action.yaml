name: "Initiate Terraform Azure"
description: "Runs terraform init and validate using an Azure Storage Account as the remote state backend"
author: 'step-security'

inputs:
  AZ_CLIENT_ID:
    required: true
    description: Client ID of the Azure Managed Identity used for authentication
  AZ_TENANT_ID:
    required: true
    description: ID of the Azure Active Directory tenant
  AZ_SUBSCRIPTION_ID:
    required: true
    description: ID of the Azure subscription that owns the backend resources
  STORAGE_ACCOUNT_RESOURCEGROUP:
    required: true
    description: Name of the resource group that contains the Terraform state storage account
  STORAGE_ACCOUNT_NAME:
    required: true
    description: Name of the Azure Storage Account used to store Terraform state
  STORAGE_ACCOUNT_CONTAINER:
    required: true
    description: Name of the blob container within the storage account that holds the state file
  STORAGE_BLOB_NAME:
    required: false
    description: Blob name (key) used to identify the state file within the container
    default: terraform.tfstate
  TERRAFORM_DIRECTORY:
    required: true
    description: Filesystem path to the directory containing the Terraform root module

runs:
  using: composite
  steps:
    - name: Subscription check
      shell: bash
      env:
        REPO_PRIVATE: ${{ github.event.repository.private }}
      run: |
        UPSTREAM="zingdevlimited/actions-helpers"
        ACTION_REPO="${GITHUB_ACTION_REPOSITORY:-}"
        DOCS_URL="https://docs.stepsecurity.io/actions/stepsecurity-maintained-actions"

        echo ""
        echo -e "\033[1;36mStepSecurity Maintained Action\033[0m"
        echo "Secure drop-in replacement for $UPSTREAM"
        if [ "$REPO_PRIVATE" = "false" ]; then
          echo -e "\033[32m✓ Free for public repositories\033[0m"
        fi
        echo -e "\033[36mLearn more:\033[0m $DOCS_URL"
        echo ""

        if [ "$REPO_PRIVATE" != "false" ]; then
          SERVER_URL="${GITHUB_SERVER_URL:-https://github.com}"

          if [ "$SERVER_URL" != "https://github.com" ]; then
            BODY=$(printf '{"action":"%s","ghes_server":"%s"}' "$ACTION_REPO" "$SERVER_URL")
          else
            BODY=$(printf '{"action":"%s"}' "$ACTION_REPO")
          fi

          API_URL="https://agent.api.stepsecurity.io/v1/github/$GITHUB_REPOSITORY/actions/maintained-actions-subscription"

          RESPONSE=$(curl --max-time 3 -s -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "$API_URL" -o /dev/null) && CURL_EXIT_CODE=0 || CURL_EXIT_CODE=$?

          if [ $CURL_EXIT_CODE -ne 0 ]; then
            echo "Timeout or API not reachable. Continuing to next step."
          elif [ "$RESPONSE" = "403" ]; then
            echo -e "::error::\033[1;31mThis action requires a StepSecurity subscription for private repositories.\033[0m"
            echo -e "::error::\033[31mLearn how to enable a subscription: $DOCS_URL\033[0m"
            exit 1
          fi
        fi

    - name: Validate inputs
      shell: bash
      env:
        AZ_CLIENT_ID: ${{ inputs.AZ_CLIENT_ID }}
        AZ_TENANT_ID: ${{ inputs.AZ_TENANT_ID }}
        AZ_SUBSCRIPTION_ID: ${{ inputs.AZ_SUBSCRIPTION_ID }}
        STORAGE_ACCOUNT_RESOURCEGROUP: ${{ inputs.STORAGE_ACCOUNT_RESOURCEGROUP }}
        STORAGE_ACCOUNT_NAME: ${{ inputs.STORAGE_ACCOUNT_NAME }}
        STORAGE_ACCOUNT_CONTAINER: ${{ inputs.STORAGE_ACCOUNT_CONTAINER }}
        STORAGE_BLOB_NAME: ${{ inputs.STORAGE_BLOB_NAME }}
        TERRAFORM_DIRECTORY: ${{ inputs.TERRAFORM_DIRECTORY }}
      run: |
        set -euo pipefail

        missing=()
        for name in AZ_CLIENT_ID AZ_TENANT_ID AZ_SUBSCRIPTION_ID \
                    STORAGE_ACCOUNT_RESOURCEGROUP STORAGE_ACCOUNT_NAME \
                    STORAGE_ACCOUNT_CONTAINER STORAGE_BLOB_NAME \
                    TERRAFORM_DIRECTORY; do
          [[ -n "${!name:-}" ]] || missing+=("$name")
        done

        if (( ${#missing[@]} > 0 )); then
          printf '::error::Required input %s was not provided\n' "${missing[@]}"
          exit 1
        fi

    - name: Setup Terraform
      uses: step-security/setup-terraform@v4
      with:
        terraform_wrapper: false

    - name: Terraform Init
      shell: bash
      working-directory: ${{ inputs.TERRAFORM_DIRECTORY }}
      env:
        AZ_TENANT_ID: ${{ inputs.AZ_TENANT_ID }}
        AZ_CLIENT_ID: ${{ inputs.AZ_CLIENT_ID }}
        AZ_SUBSCRIPTION_ID: ${{ inputs.AZ_SUBSCRIPTION_ID }}
        STORAGE_ACCOUNT_RESOURCEGROUP: ${{ inputs.STORAGE_ACCOUNT_RESOURCEGROUP }}
        STORAGE_ACCOUNT_NAME: ${{ inputs.STORAGE_ACCOUNT_NAME }}
        STORAGE_ACCOUNT_CONTAINER: ${{ inputs.STORAGE_ACCOUNT_CONTAINER }}
        STORAGE_BLOB_NAME: ${{ inputs.STORAGE_BLOB_NAME }}
      run: |
        terraform init \
          --backend-config="tenant_id=$AZ_TENANT_ID" \
          --backend-config="client_id=$AZ_CLIENT_ID" \
          --backend-config="subscription_id=$AZ_SUBSCRIPTION_ID" \
          --backend-config="resource_group_name=$STORAGE_ACCOUNT_RESOURCEGROUP" \
          --backend-config="storage_account_name=$STORAGE_ACCOUNT_NAME" \
          --backend-config="container_name=$STORAGE_ACCOUNT_CONTAINER" \
          --backend-config="key=$STORAGE_BLOB_NAME"

    - name: Terraform Validate
      shell: bash
      working-directory: ${{ inputs.TERRAFORM_DIRECTORY }}
      run: terraform validate
