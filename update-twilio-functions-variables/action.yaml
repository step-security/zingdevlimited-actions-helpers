name: "Update Twilio Functions Variables"
description: Writes or updates environment variables on a Twilio Functions Service environment
author: 'step-security'
inputs:
  SERVICE_NAME:
    required: true
    description: Unique name of the Twilio Functions Service whose environment variables will be updated
  ENVIRONMENT_SUFFIX:
    required: false
    description: (Optional) Domain suffix that identifies the target Functions Environment
  VARIABLES_ENV:
    required: true
    description: Key/value pairs to deploy, provided in `.env` file format (one `KEY=VALUE` per line)
  OPTIONAL_VARIABLES:
    required: false
    description: (Optional) Comma-separated list of variable keys that are not required. Empty values are accepted without error, and any pre-existing value is preserved rather than deleted.
  TWILIO_API_KEY:
    required: true
    description: SID of the Twilio API Key used for authentication
  TWILIO_API_SECRET:
    required: true
    description: Secret associated with the Twilio API Key

runs:
  using: node24
  main: dist/index.js
