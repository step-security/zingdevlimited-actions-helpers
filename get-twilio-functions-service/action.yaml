name: "Get Twilio Functions Service"
description: Looks up identifying details (SIDs and base URL) for a deployed Twilio Functions Service
author: 'step-security'
inputs:
  SERVICE_NAME:
    required: true
    description: Unique name used to identify the target Twilio Functions Service
  ENVIRONMENT_SUFFIX:
    required: false
    description: (Optional) Domain suffix of the Functions Environment to look up
  IGNORE_NOT_FOUND:
    required: false
    description: (Optional) When set to `true`, a missing service does not cause the step to fail; empty strings are returned for all outputs instead.
  IS_PATTERN:
    required: false
    description: (Optional) When set to `true`, all services are enumerated and the first one whose unique name contains SERVICE_NAME as a substring is selected. The step always fails if no matching service is found.
  TWILIO_API_KEY:
    required: true
    description: SID of the Twilio API Key used for authentication
  TWILIO_API_SECRET:
    required: true
    description: Secret associated with the Twilio API Key
outputs:
  BASE_URL:
    description: "Root URL of the Functions Service environment. e.g.: https://domain-name-1234-stage.twil.io"
  SERVICE_SID:
    description: "SID that identifies the Functions Service"
  ENVIRONMENT_SID:
    description: "SID that identifies the Functions Environment"
  BUILD_SID:
    description: "SID of the most recent Build deployed to the Functions Environment, if one exists"
  RESOLVED_SERVICE_NAME:
    description: "Unique name of the Functions Service that was matched. Most relevant when IS_PATTERN is enabled."

runs:
  using: node24
  main: dist/index.js
