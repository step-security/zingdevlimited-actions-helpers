name: "Create Flex Plugin Version"
description: Registers a new Flex Plugin Version using the URL of an already-deployed bundle asset
author: 'step-security'
inputs:
  PLUGIN_NAME:
    required: true
    description: Unique name of the Flex Plugin to register a version for
  PLUGIN_VERSION:
    required: true
    description: Semantic version string for the new plugin version
  ASSET_URL:
    required: true
    description: Publicly accessible URL pointing to the deployed JavaScript bundle for this plugin
  TWILIO_API_KEY:
    required: true
    description: SID of the Twilio API Key used for authentication
  TWILIO_API_SECRET:
    required: true
    description: Secret associated with the Twilio API Key
outputs:
  PLUGIN_VERSION_SID:
    description: SID of the Plugin Version that was created or already existed.
  
runs:
  using: node24
  main: dist/index.js