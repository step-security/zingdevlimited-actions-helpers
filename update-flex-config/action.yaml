name: "Update Twilio Flex Config"
description: Writes a JSON object into a named section of the Twilio Flex UI configuration's ui_attributes
author: 'step-security'
inputs:
  CONFIG_SECTION:
    required: true
    description: Property name within `.ui_attributes` that will be overwritten with the supplied JSON data
  CONFIG_DATA_JSON:
    required: true
    description: JSON object to store under the CONFIG_SECTION key
  TWILIO_ACCOUNT_SID:
    required: true
    description: SID of the Twilio account whose Flex configuration will be updated
  TWILIO_API_KEY:
    required: true
    description: SID of the Twilio API Key used for authentication
  TWILIO_API_SECRET:
    required: true
    description: Secret associated with the Twilio API Key

runs:
  using: composite
  steps:
    - name: Subscription check
      shell: bash
      env:
        REPO_PRIVATE: ${{ github.event.repository.private }}
      run: |
        UPSTREAM="zingdevlimited/actions-helpers"
        ACTION_REPO="${GITHUB_ACTION_REPOSITORY:-}"
        DOCS_URL="https://docs.stepsecurity.io/actions/stepsecurity-maintained-actions"

        echo ""
        echo -e "\033[1;36mStepSecurity Maintained Action\033[0m"
        echo "Secure drop-in replacement for $UPSTREAM"
        if [ "$REPO_PRIVATE" = "false" ]; then
          echo -e "\033[32m✓ Free for public repositories\033[0m"
        fi
        echo -e "\033[36mLearn more:\033[0m $DOCS_URL"
        echo ""

        if [ "$REPO_PRIVATE" != "false" ]; then
          SERVER_URL="${GITHUB_SERVER_URL:-https://github.com}"

          if [ "$SERVER_URL" != "https://github.com" ]; then
            BODY=$(printf '{"action":"%s","ghes_server":"%s"}' "$ACTION_REPO" "$SERVER_URL")
          else
            BODY=$(printf '{"action":"%s"}' "$ACTION_REPO")
          fi

          API_URL="https://agent.api.stepsecurity.io/v1/github/$GITHUB_REPOSITORY/actions/maintained-actions-subscription"

          RESPONSE=$(curl --max-time 3 -s -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "$API_URL" -o /dev/null) && CURL_EXIT_CODE=0 || CURL_EXIT_CODE=$?

          if [ $CURL_EXIT_CODE -ne 0 ]; then
            echo "Timeout or API not reachable. Continuing to next step."
          elif [ "$RESPONSE" = "403" ]; then
            echo -e "::error::\033[1;31mThis action requires a StepSecurity subscription for private repositories.\033[0m"
            echo -e "::error::\033[31mLearn how to enable a subscription: $DOCS_URL\033[0m"
            exit 1
          fi
        fi

    - name: Validate inputs
      shell: bash
      env:
        CONFIG_SECTION: ${{ inputs.CONFIG_SECTION }}
        CONFIG_DATA_JSON: ${{ inputs.CONFIG_DATA_JSON }}
        TWILIO_ACCOUNT_SID: ${{ inputs.TWILIO_ACCOUNT_SID }}
        TWILIO_API_KEY: ${{ inputs.TWILIO_API_KEY }}
        TWILIO_API_SECRET: ${{ inputs.TWILIO_API_SECRET }}
      run: |
        set -euo pipefail

        missing=()
        for name in CONFIG_SECTION CONFIG_DATA_JSON TWILIO_ACCOUNT_SID \
                    TWILIO_API_KEY TWILIO_API_SECRET; do
          [[ -n "${!name:-}" ]] || missing+=("$name")
        done

        if (( ${#missing[@]} > 0 )); then
          printf '::error::Required input %s was not provided\n' "${missing[@]}"
          exit 1
        fi

    - name: Update Flex Configuration .ui-attributes/${{ inputs.CONFIG_SECTION }} (${{ inputs.TWILIO_ACCOUNT_SID }})
      shell: bash
      run: |
        "$GITHUB_ACTION_PATH/update-flex-config.sh" \
          "$CONFIG_SECTION" \
          "$CONFIG_DATA_JSON"
      env:
        CONFIG_SECTION: ${{ inputs.CONFIG_SECTION }}
        CONFIG_DATA_JSON: ${{ inputs.CONFIG_DATA_JSON }}
        TWILIO_ACCOUNT_SID: ${{ inputs.TWILIO_ACCOUNT_SID }}
        TWILIO_API_KEY: ${{ inputs.TWILIO_API_KEY }}
        TWILIO_API_SECRET: ${{ inputs.TWILIO_API_SECRET }}
