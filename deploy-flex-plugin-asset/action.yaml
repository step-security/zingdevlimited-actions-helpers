name: "Deploy Flex Plugin Asset"
description: Uploads a compiled Flex Plugin JavaScript bundle to the default Twilio Plugin Asset Service
author: 'step-security'
inputs:
  FILE_PATH:
    required: true
    description: Local filesystem path to the compiled plugin JavaScript bundle
  PLUGIN_NAME:
    required: true
    description: Name of the plugin, matching the `name` field in package.json
  PLUGIN_VERSION:
    required: true
    description: Version of the plugin, matching the `version` field in package.json
  TWILIO_API_KEY:
    required: true
    description: SID of the Twilio API Key used for authentication
  TWILIO_API_SECRET:
    required: true
    description: Secret associated with the Twilio API Key
  ALLOW_VERSION_OVERWRITE:
    required: false
    description: (Optional) When set to `true`, an existing bundle for the same version will be overwritten rather than causing an error
outputs:
  ASSET_URL:
    description: Publicly accessible URL of the uploaded plugin bundle asset
  DEPLOY_SID:
    description: SID of the Serverless Asset Deployment created for this upload
  
runs:
  using: node24
  main: dist/index.js