name: Update Twilio Sync
description: |
  Applies Sync resource definitions from a JSON config file. Only creates new resources — existing ones are not modified.
author: 'step-security'

inputs:
  CONFIG_PATH:
    required: true
    description: Filesystem path to the Sync configuration JSON file. **Make sure this file has been checked out before this step runs.**
  SERVICE_NAME:
    required: false
    description: |
      (Optional) Friendly name of the Sync Service to target. If the service does not exist it will be created.

      When omitted, resources are applied to the account's default Sync Service.
  SERVICE_ACL_ENABLED:
    required: false
    description: |
      (Optional) Applies only when **SERVICE_NAME** is provided. Set to `true` to turn on ACL enforcement for the Sync Service.
  TWILIO_API_KEY:
    required: true
    description: SID of the Twilio API Key used for authentication
  TWILIO_API_SECRET:
    required: true
    description: Secret associated with the Twilio API Key

outputs:
  SYNC_SERVICE_SID:
    description: SID of the Sync Service that the resources were applied to

runs:
  using: node24
  main: dist/index.js