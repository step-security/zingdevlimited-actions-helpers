name: Update Taskrouter
description: Applies Taskrouter resource definitions from a JSON config file to an existing Twilio Taskrouter Workspace.
author: 'step-security'

inputs:
  CONFIG_PATH:
    required: true
    description: Filesystem path to the Taskrouter configuration JSON file. **Make sure this file has been checked out before this step runs.**
  TWILIO_API_KEY:
    required: true
    description: SID of the Twilio API Key used for authentication
  TWILIO_API_SECRET:
    required: true
    description: Secret associated with the Twilio API Key
  WORKSPACE_NAME:
    required: false
    description: |
      **For accounts not using Flex**. Friendly name of an existing Taskrouter Workspace to target.
      Leave this unset when working with the default Flex Workspace.
  WORKSPACE_CALLBACK_URL:
    required: false
    description: |
      Event callback URL to assign to the workspace. If the JSON config file also specifies a callback URL, that value takes precedence.

outputs:
  RESOURCES:
    description: "JSON array describing all Taskrouter resources created or updated during this run"
  WORKSPACE_SID:
    description: "SID of the Taskrouter Workspace that was targeted"

runs:
  using: node24
  main: dist/index.js
